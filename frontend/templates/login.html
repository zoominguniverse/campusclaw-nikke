<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CampusClaw 登录</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body class="login-page" data-api-url="{{ api_url }}">
  <main class="login-layout"><section class="login-brand"><span class="brand-mark">✦</span><span class="eyebrow">智能教学平台</span><h1>CampusClaw<br>让课堂知识更有序</h1><p>登录后通过安全的 Authorization 凭证访问你的教学工作区。</p></section>
  <section class="login-form-region"><div class="login-card"><h2>账号登录</h2><form id="login-form" class="form-stack"><label>账号 <input name="username" required autocomplete="username"></label><label>密码 <input name="password" type="password" required autocomplete="current-password"></label><button class="primary-action" type="submit">登录并进入平台</button></form><p id="error" class="form-error" role="alert"></p></div></section></main>
  <script src="{{ url_for('static', filename='auth.js') }}" defer></script><script src="{{ url_for('static', filename='login.js') }}" defer></script>
</body>
</html>
