<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CampusClaw · AI 学习辅导</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/tutor.css"></head>
<body class="workspace-page" data-api-url="{{ api_url }}"><div class="app-shell">
<aside class="sidebar"><a class="sidebar-brand" href="/materials"><strong>CampusClaw</strong></a><nav class="role-nav"><a href="/materials">教学材料与知识检索</a><a class="is-active" href="/tutor">AI 学习辅导</a><a id="config-link" href="/tutor-config" hidden>智能体与技能</a></nav><h2>最近会话</h2><ul id="conversations" class="conversation-list"></ul></aside>
<div class="workspace"><header class="topbar"><span id="current-account"></span><span class="topbar-spacer"></span><button id="logout-button" type="button">退出登录</button></header>
<main class="workspace-content"><div class="page-intro"><h1>AI 学习辅导</h1><p>选择助手，分享你的问题和思路。</p></div>
<section class="panel"><label for="agent-select">新会话使用的智能体</label><div class="action-row"><select id="agent-select"></select><button id="new-conversation" type="button">新建会话</button></div><p id="selection-hint" class="field-hint">更换助手后新建会话。已有会话保留原助手。</p></section>
<p id="status" class="status-message" role="status" aria-live="polite"></p><section class="panel"><h2 id="conversation-title">开始新的提问</h2><p id="active-agent" class="field-hint"></p><div id="messages" class="chat-messages"></div>
<form id="question-form" class="form-stack"><label for="question">你的问题（2–500字）</label><textarea id="question" rows="3" maxlength="1000" required></textarea><div class="action-row"><button id="send" class="primary-action">发送</button><button id="cancel" type="button" hidden>停止生成</button></div><p class="field-hint">Enter 换行，Ctrl / ⌘ + Enter 发送。中断后可从历史继续。</p></form></section>
<section id="source-panel" class="panel" hidden><h2 id="source-title">材料原文</h2><p id="source-status" role="status"></p><pre id="source-body" tabindex="0"></pre><button id="close-source" type="button">关闭原文</button></section></main></div></div>
<script src="/static/auth.js" defer></script><script src="/static/tutor-sse.js" defer></script><script src="/static/tutor-tools.js" defer></script><script src="/static/tutor.js" defer></script></body></html>
