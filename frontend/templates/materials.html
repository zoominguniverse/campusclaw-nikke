<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CampusClaw 教学工作区</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body class="workspace-page" data-api-url="{{ api_url }}" data-sidebar-open="false"><div class="app-shell"><aside id="workspace-sidebar" class="sidebar"><a class="sidebar-brand" href="#materials"><span class="brand-mark">✦</span><span><strong>CampusClaw</strong><small>智能教学平台</small></span></a><p id="role-kicker" class="nav-kicker"></p><nav id="workspace-nav" class="role-nav"></nav></aside><div class="workspace"><header class="topbar"><button id="nav-toggle" class="nav-toggle" type="button">☰</button><span id="context-indicator" class="context-indicator"></span><span class="topbar-spacer"></span><span id="current-account" class="current-account"></span><button id="logout-button" class="logout-action" type="button">退出登录</button></header><main class="workspace-content"><p id="message" class="status-message"></p><section id="view-materials" class="workspace-view" data-view="materials"><div class="page-intro"><h1 id="materials-heading">教学材料</h1><p>按学科浏览、预览、下载和维护课程资料。</p></div><div class="panel-grid"><section class="panel panel--wide"><h2>材料列表</h2><label class="field-label">学科 <select id="subject-select"><option value="">全部可访问学科</option></select></label><ul id="materials" class="material-list"></ul></section><section id="upload-panel" class="panel panel--narrow" hidden><h2>上传材料</h2><form id="upload-form" class="form-stack"><label>标题（可选）<input name="title"></label><label>材料 <input type="file" name="file" accept=".txt,.md" required></label><input id="upload-subject-id" name="subject_id" type="hidden"><button class="primary-action">上传材料</button></form></section></div></section><section id="view-retrieve" class="workspace-view" data-view="retrieve" hidden><div class="page-intro"><h1>知识检索</h1></div><section class="panel"><form id="search-form" class="inline-form"><label class="field-label">检索词 <input id="search-query" required></label><label class="field-label">模式 <select id="search-mode"><option value="hybrid">混合检索</option><option value="keyword">关键词</option><option value="vector">语义向量</option></select></label><button class="primary-action">开始检索</button></form><p id="search-message" class="status-message"></p><ol id="search-results" class="result-list"></ol></section></section><section id="view-ask" class="workspace-view" data-view="ask" hidden><div class="page-intro"><h1>基于资料提问</h1></div><section class="panel"><form id="ask-form" class="inline-form"><label class="field-label">问题 <input id="ask-question" required></label><button class="primary-action">提交问题</button></form><p id="answer-text" class="status-message"></p><ol id="citations" class="result-list"></ol></section></section><section id="preview" class="panel preview-panel" hidden><h2 id="preview-title">材料预览</h2><pre id="preview-body"></pre><button id="close-preview" class="logout-action" type="button">关闭预览</button></section></main></div></div><script src="{{ url_for('static', filename='auth.js') }}" defer></script><script src="{{ url_for('static', filename='materials.js') }}" defer></script></body></html>
