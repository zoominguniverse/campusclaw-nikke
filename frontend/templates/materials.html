<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>CampusClaw 材料</title></head>
<body>
  <main>
    <h1>本班教学材料</h1>
    <p>当前用户：{{ user.username }}（{{ user.role }}，班级 {{ user.class_id }}） <button id="logout-button" type="button">退出登录</button></p>
    {% if user.role == 'teacher' %}
    <form id="upload-form" enctype="multipart/form-data">
      <label>标题（可选）<input name="title"></label>
      <label>材料 <input type="file" name="file" accept=".txt,.md" required></label>
      <button type="submit">上传材料</button>
    </form>
    {% endif %}
    <p id="message" role="status"></p>
    <ul id="materials"></ul>
    <section aria-labelledby="search-heading">
      <h2 id="search-heading">检索本班材料</h2>
      <form id="search-form">
        <label>检索词 <input id="search-query" required></label>
        <label>模式 <select id="search-mode"><option value="hybrid">混合检索</option><option value="keyword">关键词</option><option value="vector">语义向量</option></select></label>
        <button type="submit">检索</button>
      </form>
      <p id="search-message" role="status"></p>
      <ol id="search-results"></ol>
    </section>
    <section aria-labelledby="ask-heading">
      <h2 id="ask-heading">基于材料提问</h2>
      <form id="ask-form"><label>问题 <input id="ask-question" required></label><button type="submit">提问</button></form>
      <p id="answer-text" role="status"></p>
      <ol id="citations"></ol>
    </section>
    <section id="preview" hidden>
      <h2 id="preview-title">材料预览</h2>
      <pre id="preview-body"></pre>
      <button id="close-preview" type="button">关闭预览</button>
    </section>
  </main>
  <script>
    const api = '{{ api_url }}';
    const user = {{ user | tojson }};
    let csrfToken = '';
    async function apiFetch(path, options = {}) {
      options.credentials = 'include';
      options.headers = {...(options.headers || {}), 'X-CSRF-Token': csrfToken};
      const response = await fetch(api + path, options);
      if (response.status === 401) window.location.assign('/login?next=/materials');
      return response;
    }
    async function loadMaterials() {
      const response = await apiFetch(`/api/classes/${user.class_id}/materials`);
      if (!response.ok) return;
      const data = await response.json();
      document.querySelector('#materials').replaceChildren(...data.items.map(item => {
        const li = document.createElement('li');
        const title = document.createElement('span'); title.textContent = item.title;
        const button = document.createElement('button'); button.type = 'button'; button.textContent = '在线预览';
        button.addEventListener('click', () => previewMaterial(item.id));
        const download = document.createElement('a');
        download.href = `${api}/api/classes/${user.class_id}/materials/${item.id}/download`;
        download.textContent = '下载文件';
        li.append(title, ' ', button, ' ', download);
        return li;
      }));
    }
    async function previewMaterial(materialId) {
      const response = await apiFetch(`/api/classes/${user.class_id}/materials/${materialId}`);
      if (!response.ok) {
        document.querySelector('#message').textContent = '预览加载失败。';
        return;
      }
      const data = await response.json();
      document.querySelector('#preview-title').textContent = data.material.title;
      document.querySelector('#preview-body').textContent = data.body_text;
      document.querySelector('#preview').hidden = false;
    }
    (async () => {
      const response = await apiFetch('/api/auth/me');
      if (!response.ok) return;
      csrfToken = (await response.json()).csrf_token;
      await loadMaterials();
    })();
    const form = document.querySelector('#upload-form');
    if (form) form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const response = await apiFetch(`/api/classes/${user.class_id}/materials`, {method: 'POST', body: new FormData(form)});
      let uploadMessage = '上传失败。';
      if (!response.ok) {
        const failure = await response.json().catch(() => null);
        if (failure && typeof failure.error === 'string' && failure.error.trim()) uploadMessage = failure.error;
      }
      document.querySelector('#message').textContent = response.ok ? '上传成功。' : uploadMessage;
      if (response.ok) { form.reset(); await loadMaterials(); }
    });
    document.querySelector('#logout-button').addEventListener('click', async () => {
      const response = await apiFetch('/api/auth/logout', {method: 'POST'});
      if (response.status === 204) {
        window.location.assign('/login');
        return;
      }
      document.querySelector('#message').textContent = '退出登录失败，请重试。';
    });
    document.querySelector('#close-preview').addEventListener('click', () => {
      document.querySelector('#preview').hidden = true;
    });
    function renderHits(hits) {
      document.querySelector('#search-results').replaceChildren(...hits.map(hit => {
        const li = document.createElement('li');
        const source = document.createElement('strong'); source.textContent = `${hit.material_title} · 切片 ${hit.chunk_index}`;
        const excerpt = document.createElement('pre'); excerpt.textContent = hit.excerpt;
        const open = document.createElement('button'); open.type = 'button'; open.textContent = '打开材料'; open.addEventListener('click', () => previewMaterial(hit.material_id));
        li.append(source, excerpt, open); return li;
      }));
    }
    document.querySelector('#search-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const response = await apiFetch(`/api/classes/${user.class_id}/knowledge/retrieve`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({query: document.querySelector('#search-query').value, mode: document.querySelector('#search-mode').value})});
      const message = document.querySelector('#search-message');
      if (!response.ok) { message.textContent = '检索暂不可用。'; return; }
      const data = await response.json(); message.textContent = data.message || `找到 ${data.hits.length} 条结果。`; renderHits(data.hits);
    });
    document.querySelector('#ask-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const response = await apiFetch(`/api/classes/${user.class_id}/knowledge/ask`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({question: document.querySelector('#ask-question').value})});
      const answer = document.querySelector('#answer-text'); const citations = document.querySelector('#citations');
      if (!response.ok) { answer.textContent = '回答暂不可用。'; citations.replaceChildren(); return; }
      const data = await response.json(); answer.textContent = data.answer;
      citations.replaceChildren(...data.citations.map((citation, index) => { const li = document.createElement('li'); li.textContent = `[${index + 1}] ${citation.material_title} · 切片 ${citation.chunk_index}：${citation.excerpt}`; return li; }));
    });
  </script>
</body>
</html>
