# Combine with retrieval-test.yml. Import provider settings only; the base
# disposable database URL, tmpfs, and isolation remain unchanged.
# Use config --quiet to avoid printing expanded credentials.
services:
  quality-tests:
    environment:
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-campusclaw-deterministic}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-sha256-demo-v1}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-64}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-10}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      VECTOR_THRESHOLD: ${VECTOR_THRESHOLD:-0.35}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-deterministic}
      CHAT_API_URL: ${CHAT_API_URL:-}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-campusclaw-deterministic}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-60}
      SEMANTIC_RELEASE: "false"
      SEED_DEMO_DATA: "false"
