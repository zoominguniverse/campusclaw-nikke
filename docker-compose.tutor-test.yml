# Separate project, database, upload storage and fake provider. No .env credentials.
services:
  tutor-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tutor_test
      POSTGRES_USER: tutor_test
      POSTGRES_PASSWORD: disposable-tutor-only
    tmpfs: [/var/lib/postgresql/data]
    ports: ["127.0.0.1:5546:5432"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U tutor_test -d tutor_test]
      interval: 2s
      timeout: 5s
      retries: 30
  tutor-provider:
    build: ./backend
    entrypoint: [gunicorn, --bind, "0.0.0.0:8090", --workers, "1", --worker-class, gthread, --threads, "8", "evaluation.tutor_provider_fixture:app"]
  tutor-api:
    build: ./backend
    entrypoint: [python, -m, evaluation.tutor_fixture]
    environment:
      SECRET_KEY: disposable-tutor-server-secret
      AUTH_TOKEN_SECRET: disposable-tutor-token-secret
      DATABASE_URL: postgresql+psycopg://tutor_test:disposable-tutor-only@tutor-postgres:5432/tutor_test
      TUTOR_DISPOSABLE_DATABASE: "true"
      EMBEDDING_PROVIDER: deterministic
      EMBEDDING_DIMENSIONS: "64"
      CHAT_PROVIDER: openai-compatible
      CHAT_API_URL: http://tutor-provider:8090
      CHAT_API_KEY: disposable-fixture-key
      CHAT_MODEL: controlled-tutor-fixture
      UPLOAD_DIR: /tmp/tutor-uploads
      TRUSTED_ORIGINS: http://localhost:5176
    depends_on:
      tutor-postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 3s
      timeout: 5s
      retries: 30
  tutor-web:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://tutor-api:8080
      API_PUBLIC_URL: ""
    ports: ["127.0.0.1:5176:5173"]
    depends_on:
      tutor-api: {condition: service_healthy}
  tutor-apitest:
    build: ./backend
    volumes:
      - ./apitest:/apitest
      - ./backend/tutor_samples:/samples:ro
    working_dir: /apitest
    entrypoint: [python, run_all.py]
    environment:
      TUTOR_TEST_BASE_URL: http://tutor-web:5173
      TUTOR_TEST_INFO_URL: http://tutor-api:8080/tutor-test-info
      TUTOR_TEST_DATABASE_URL: postgresql://tutor_readonly:disposable-readonly-only@tutor-postgres:5432/tutor_test
      TUTOR_TEST_PROVIDER_URL: http://tutor-provider:8090
      TUTOR_DISPOSABLE_DATABASE: "true"
    depends_on:
      tutor-web: {condition: service_started}
