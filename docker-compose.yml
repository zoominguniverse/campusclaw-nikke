services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-./postgres-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      INITIALIZE_DATABASE: "false"
      DEMO_TEACHER_PASSWORD: ${DEMO_TEACHER_PASSWORD:-}
      DEMO_TEACHER_B_PASSWORD: ${DEMO_TEACHER_B_PASSWORD:-}
      DEMO_STUDENT_A_PASSWORD: ${DEMO_STUDENT_A_PASSWORD:-}
      DEMO_STUDENT_A2_PASSWORD: ${DEMO_STUDENT_A2_PASSWORD:-}
      DEMO_STUDENT_B_PASSWORD: ${DEMO_STUDENT_B_PASSWORD:-}
      DEMO_STUDENT_B2_PASSWORD: ${DEMO_STUDENT_B2_PASSWORD:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - ${UPLOAD_DATA_DIR:-./uploads}:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8080
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8080}
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
