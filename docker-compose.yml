services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?set AUTH_TOKEN_SECRET in .env}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:5173}
      APP_ENV: ${APP_ENV:-development}
      AUTH_ACCESS_TTL_SECONDS: ${AUTH_ACCESS_TTL_SECONDS:-900}
      AUTH_REFRESH_TTL_SECONDS: ${AUTH_REFRESH_TTL_SECONDS:-28800}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      PURGE_LEGACY_DEMO_DATA: ${PURGE_LEGACY_DEMO_DATA:-false}
      INITIALIZE_DATABASE: "false"
      DEMO_ACCOUNT_PASSWORDS: ${DEMO_ACCOUNT_PASSWORDS:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      UPLOAD_DIR: /app/uploads
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-campusclaw-deterministic}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-64}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      VECTOR_THRESHOLD: ${VECTOR_THRESHOLD:-0.35}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-deterministic}
      CHAT_API_URL: ${CHAT_API_URL:-}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-campusclaw-deterministic}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-60}
      SEMANTIC_RELEASE: ${SEMANTIC_RELEASE:-false}
      SEMANTIC_ACCEPTANCE_REPORT: ${SEMANTIC_ACCEPTANCE_REPORT:-}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_TOKEN_ENCRYPTION_KEY: ${MCP_TOKEN_ENCRYPTION_KEY:-}
      MCP_TOOL_POLICY_JSON: ${MCP_TOOL_POLICY_JSON:-{}}
    volumes:
      - uploads_data:/app/uploads
      - ./docs/retrieval-quality-artifacts/release-acceptance.json:/app/acceptance/release-acceptance.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

  mcp-demo:
    build: ./mcp-server
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8080
      API_PUBLIC_URL: ""
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
